name: Ansteel governance gate

on:
  pull_request:
    paths:
      - "pi-agent/packages/coding-agent/src/core/ansteel-**"
      - "pi-agent/packages/coding-agent/src/extensions/ansteel-team/**"
      - "pi-agent/packages/coding-agent/test/ansteel-**"
      - "pi-agent/packages/coding-agent/docs/ansteel*.md"
      - ".github/workflows/ansteel-governance.yml"
  push:
    branches: [main]
    paths:
      - "pi-agent/packages/coding-agent/**"
      - ".github/workflows/ansteel-governance.yml"

permissions:
  contents: read

jobs:
  governance:
    name: deterministic governance checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pi-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pi-agent/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node packages/coding-agent/node_modules/vitest/vitest.mjs --run --no-file-parallelism packages/coding-agent/test/ansteel-discussion.test.ts packages/coding-agent/test/ansteel-cli.test.ts packages/coding-agent/test/ansteel-team.test.ts packages/coding-agent/test/ansteel-team-cli.test.ts packages/coding-agent/test/ansteel-team-extension.test.ts
      - run: node_modules/.bin/tsgo --noEmit -p packages/coding-agent/tsconfig.build.json
      - run: git diff --check
